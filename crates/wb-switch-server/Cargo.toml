[package]
name = "wb-switch-server"
version = "0.2.8-rc.202611131031"
edition = "2021"
description = "wb-switch HTTP server + CLI（npm 安装形态：wb-switch 命令启动本地 webui）"

[[bin]]
name = "wb-switch"
path = "src/main.rs"

[dependencies]
wb-switch-core = { path = "../wb-switch-core" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
chrono = "0.4"
rust-embed = "8"
tower = { version = "0.5", features = ["util"] }
form_urlencoded = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Environment", "Win32_UI_WindowsAndMessaging"] }
