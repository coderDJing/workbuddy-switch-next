name: test

# 测试必须独立于发布流程：build.yml 仅由 tag push / workflow_dispatch 触发，
# 测试若挂在它下面，就只在发版时执行——2026-09 的 Windows「os error 5」回归
# 正是这样漏到 0.1.43 的。本 workflow 在 push 与 PR 上即触发。
on:
  workflow_call:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 两个支持平台结果一次跑齐：任一平台失败不阻塞其余平台出结果。
      fail-fast: false
      matrix:
        os:
          - macos-26
          - windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 与 build.yml 分开的 key 前缀（那边是 release profile 产物），
      # restore-keys 回落到它的缓存，以复用依赖编译产物。
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-

      # 只跑 core：零 tauri 依赖，不需要 webkit / npm / 前端 dist。
      # 不传 --target，使用 runner 原生 target；macOS 构建与测试均使用 Apple Silicon。
      - name: Run tests
        run: cargo test -p wb-switch-core
        env:
          WB_SWITCH_HOME: ${{ runner.temp }}/wb-switch-test-home

      # One-shot CLI 与 npm 入口也必须覆盖两个支持平台。server 测试只需 SPA 占位，
      # 真正前端构建与 Tauri 检查仍由 lint job 完成。
      - name: Prepare server test assets
        run: |
          node -e "const fs = require('node:fs'); fs.mkdirSync('dist', {recursive:true}); fs.writeFileSync('dist/index.html', '<!doctype html><title>CLI test fixture</title>');"

      - name: CLI tests
        run: cargo test -p wb-switch-server

      - name: npm launcher tests
        run: node --test npm/tests/cli-launcher.test.cjs npm/tests/daily-install.test.cjs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Daily task adapter and upstream tests
        run: |
          python -m pip install requests==2.32.5
          python -m unittest discover -s vendor/daily-runner -p 'test_*.py'
          python -m unittest discover -s vendor/daily-runner/upstream/workbuddy/tests -p 'test_*.py'
          python -m unittest discover -s vendor/daily-runner/upstream/qoder/tests -p 'test_*.py'

      - name: Desktop CLI registration tests
        run: node scripts/test-desktop-cli-install.mjs

      - name: Companion core and runtime tests
        run: cargo test --manifest-path vendor/agent-companion/Cargo.toml -p agent-studio-core -p agent-studio-runtime --locked

      - name: Companion desktop tests
        run: cargo test --manifest-path vendor/agent-companion/Cargo.toml -p tauri-plugin-agent-studio --locked

  # 前端类型、格式与 lint 门禁在 Apple Silicon 上运行。
  # clippy 必须带 --no-deps：vendor/agent-companion 是 path 依赖快照，其告警不归本仓库。
  lint:
    name: lint (tsc + fmt + clippy + server tests)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      # 与 rust-tests 相同的 key 前缀，直接复用依赖编译产物。
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: npm ci

      # tsc 顺带产出 dist：clippy 检查 src-tauri 时 tauri-build 要求 frontendDist 存在。
      - name: Type-check and build frontend
        run: npm run build

      # tauri-build 还要求 externalBin 存在。这里只放占位文件让编译检查通过；
      # 真实 runtime 由 build.yml（发版）与 scripts/prepare-agent-companion.mjs 产出。
      - name: Stub companion runtime binary
        run: |
          mkdir -p src-tauri/binaries
          touch "src-tauri/binaries/agent-studio-runtime-$(rustc -vV | sed -n "s/^host: //p")"
          touch "src-tauri/binaries/workbuddy-switch-next-$(rustc -vV | sed -n "s/^host: //p")"
          touch "src-tauri/binaries/daily-runner-$(rustc -vV | sed -n "s/^host: //p")"

      - name: Verify macOS architecture check
        run: node --test scripts/daily-macos-arch.test.mjs

      - name: Check formatting
        run: cargo fmt --check -p wb-switch-core -p wb-switch-server -p wb-switch-rust

      - name: Clippy
        run: cargo clippy -p wb-switch-core -p wb-switch-server -p wb-switch-rust --all-targets --no-deps -- -D warnings

      # server 的 8 个测试此前从不运行（rust-tests 只覆盖 core）。
      - name: Server tests
        run: cargo test -p wb-switch-server

      # src-tauri 的 40 个测试此前从不运行（rust-tests 只覆盖 core）。
      # 前置 dist 与 stub companion binary 已由上方步骤就位。
      - name: Desktop app tests
        run: cargo test -p wb-switch-rust

  # 前端行为测试：纯逻辑单测（node 环境），不依赖 Rust 工具链。
  frontend-tests:
    name: frontend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run release:check
      - name: Verify updater manifest compatibility
        run: python3 scripts/merge-update-manifests.py --self-test
      - run: node --test scripts/vendor-agent-companion.test.mjs scripts/release-artifacts.test.mjs scripts/release-policy.test.mjs scripts/cleanup-rc-releases.test.mjs scripts/deb-cli-contents.test.mjs

      - name: Companion frontend checks
        working-directory: vendor/agent-companion
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build
          npm run test:bundle
