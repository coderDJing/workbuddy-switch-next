name: Build Next

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build (manual runs upload artifacts only)
        type: choice
        default: all
        options: [all, win-x64, mac-arm64]

permissions:
  contents: write

concurrency:
  group: next-build-and-release
  cancel-in-progress: false

jobs:
  select-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      version: ${{ steps.select.outputs.version }}
      preview: ${{ steps.select.outputs.preview }}
    steps:
      - uses: actions/checkout@v4
      - id: select
        env:
          REQUESTED_PLATFORM: ${{ inputs.platform }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const release = JSON.parse(fs.readFileSync('release-config.json', 'utf8'));
          const platforms = [
            {name:'mac-arm64',os:'macos-26',target:'aarch64-apple-darwin',platform:'darwin-arm64',bundles:'app',update_os:'macos',arch:'aarch64'},
            {name:'win-x64',os:'windows-latest',target:'x86_64-pc-windows-msvc',platform:'win32-x64',bundles:'nsis',update_os:'windows',arch:'x86_64'},
          ];
          const request = process.env.REQUESTED_PLATFORM || 'all';
          const selected = process.env.GITHUB_REF_TYPE === 'tag' || request === 'all' ? platforms : platforms.filter(p=>p.name===request);
          if (!selected.length) throw new Error('Unknown platform');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({include:selected})}\nversion=${release.version}\npreview=${release.channel==='preview'}\n`);
          JS

  verify:
    uses: ./.github/workflows/test.yml

  build:
    if: vars.PUBLISH_APP != 'false'
    needs: [select-matrix]
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      RUST_TARGET: ${{ matrix.target }}
      PLATFORM_TAG: ${{ matrix.platform }}
      UPDATE_OS: ${{ matrix.update_os }}
      UPDATE_ARCH: ${{ matrix.arch }}
      PUBLISH_APP: ${{ vars.PUBLISH_APP }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          rustflags: ""
          cache: false # The target-specific cache below already covers Cargo and target/.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-next-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-next-release-${{ matrix.target }}-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: macOS DMG tooling
        if: runner.os == 'macOS'
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild-venv"
          "$RUNNER_TEMP/dmgbuild-venv/bin/python" -m pip install --disable-pip-version-check --no-input dmgbuild==1.6.7
          echo "$RUNNER_TEMP/dmgbuild-venv/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run release:check
      - run: npm run build
      - name: Prepare Daily task component
        env:
          AGENT_COMPANION_TARGET: ${{ matrix.target }}
        run: node scripts/prepare-daily-runner.mjs
      - name: Remove this target's stale bundles
        if: vars.PUBLISH_APP != 'false'
        run: node scripts/release-artifacts.mjs clean
      - name: Signed desktop application
        if: vars.PUBLISH_APP != 'false'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AGENT_COMPANION_TARGET: ${{ matrix.target }}
          DAILY_RUNNER_PREPARED: '1'
        run: node scripts/build-release.mjs --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: macOS drag-to-Applications image
        if: runner.os == 'macOS' && vars.PUBLISH_APP != 'false'
        env:
          RELEASE_VERSION: ${{ needs.select-matrix.outputs.version }}
        run: sh scripts/make-dmg.sh "$RELEASE_VERSION" "$UPDATE_ARCH" "target/$RUST_TARGET/release/bundle/macos/WorkBuddy Switch Next.app"
      - name: Verify the app keeps its signature inside the macOS image
        if: runner.os == 'macOS' && vars.PUBLISH_APP != 'false'
        run: |
          set -uo pipefail
          APP="target/$RUST_TARGET/release/bundle/macos/WorkBuddy Switch Next.app"
          diagnose() {
            echo "== contents =="
            ls -la "$1/Contents" 2>&1 | head -20
            echo "== code signature directory =="
            ls -la "$1/Contents/_CodeSignature" 2>&1 | head -10
            echo "== codesign -dv =="
            codesign -dv --verbose=4 "$1" 2>&1 | head -25
            echo "== verify without --strict =="
            codesign --verify --deep --verbose=2 "$1" 2>&1 || true
          }

          # dmgbuild copies the bundle with ditto; a lost seal or resource
          # directory would surface to users as "已损坏", so check both stages
          # to tell a broken build from a broken image.
          if ! codesign --verify --deep --strict --verbose=2 "$APP"; then
            diagnose "$APP"
            echo "::error::The built .app already fails signature verification."
            exit 1
          fi
          echo "Built bundle verifies."

          DMG="$(ls workbuddy-switch-next_*.dmg | head -n 1)"
          MNT="$(mktemp -d)"
          hdiutil attach "$DMG" -mountpoint "$MNT" -nobrowse -quiet
          trap 'hdiutil detach "$MNT" -quiet || true' EXIT
          IMG_APP="$MNT/WorkBuddy Switch Next.app"
          if [ ! -d "$IMG_APP" ]; then
            echo "::error::DMG is missing the app bundle: $IMG_APP"
            exit 1
          fi
          if ! codesign --verify --deep --strict --verbose=2 "$IMG_APP"; then
            diagnose "$IMG_APP"
            echo "::error::The app inside the DMG fails signature verification."
            exit 1
          fi
          echo "Signature intact in the built bundle and inside the DMG."
      - name: Verify Windows desktop installer includes CLI
        if: runner.os == 'Windows' && vars.PUBLISH_APP != 'false'
        run: node scripts/verify-windows-cli-bundle.mjs
      - name: Verify macOS desktop bundle includes CLI
        if: runner.os != 'Windows' && vars.PUBLISH_APP != 'false'
        run: node scripts/verify-unix-cli-bundle.mjs
      - name: Collect signed archives and immutable updater manifests
        run: node scripts/release-artifacts.mjs collect
      - uses: actions/upload-artifact@v4
        with:
          name: next-${{ matrix.name }}
          path: dist-bin/
          if-no-files-found: error
  release:
    needs: [build, verify, select-matrix]
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_APP != 'false'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.select-matrix.outputs.version }}
      IS_PREVIEW: ${{ needs.select-matrix.outputs.preview }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: next-*
          path: artifacts
          merge-multiple: true
      - name: Validate complete updater feed
        env:
          REQUIRED_PLATFORMS: darwin-aarch64,windows-x86_64-nsis,windows-x86_64
        run: |
          python3 scripts/merge-update-manifests.py artifacts
          node scripts/release-artifacts.mjs validate artifacts
          node scripts/release-artifacts.mjs checksums artifacts
      - name: Prepare desktop download links
        run: node scripts/release-artifacts.mjs notes "docs/releases/$RELEASE_VERSION.md" release-notes.md
      - name: Publish versioned release
        run: |
          FLAGS=()
          if [ "$IS_PREVIEW" = true ]; then FLAGS+=(--prerelease --latest=false); else FLAGS+=(--latest); fi
          gh release create "v$RELEASE_VERSION" artifacts/* --verify-tag \
            --title "WorkBuddy Switch Next $RELEASE_VERSION" \
            --notes-file release-notes.md "${FLAGS[@]}"
      - name: Promote the preview update channel
        if: needs.select-matrix.outputs.preview == 'true'
        run: |
          if gh release view preview >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/preview" -f sha="$GITHUB_SHA" -F force=true
            gh release upload preview artifacts/* --clobber
            gh release edit preview --title "WorkBuddy Switch Next — 预览版" --notes-file release-notes.md --prerelease --latest=false
          else
            gh release create preview artifacts/* --target "$GITHUB_SHA" --title "WorkBuddy Switch Next — 预览版" \
              --notes-file release-notes.md --prerelease --latest=false
          fi
      - name: Remove superseded releases of this channel
        run: node scripts/cleanup-releases.mjs
