name: Inspect a macOS image

# Temporary diagnostic: mount-free inspection of the DMG that users download.
# Ubuntu runners are not affected by the macOS capacity shortage.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to inspect
        required: true
        default: v0.2.7-rc.202611101801

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download the image
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p dmg
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.dmg" --dir dmg
          ls -la dmg

      - name: Unpack and inspect the bundle
        run: |
          set -uo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full >/dev/null
          cd dmg
          IMG=$(ls *.dmg | head -1)
          echo "== archive listing =="
          7z l "$IMG" | head -30
          echo "== extract =="
          7z x -y "$IMG" -oout >/dev/null 2>&1 || true
          ls -la out | head -10
          # The HFS payload is usually a nested .hfs image.
          for inner in out/*.hfs out/*.img; do
            [ -f "$inner" ] || continue
            echo "== inner $inner =="
            7z x -y "$inner" -oapp >/dev/null 2>&1 || true
          done
          echo "== app tree (max depth 4) =="
          find . -maxdepth 4 -name "*.app" -print
          echo "== Contents =="
          find . -maxdepth 5 -path "*Contents/*" -maxdepth 5 -type d | head -20
          echo "== signature files =="
          find . -name "_CodeSignature" -o -name "CodeResources" | head -10
          echo "== resources =="
          find . -maxdepth 5 -path "*Contents/Resources*" | head -20
